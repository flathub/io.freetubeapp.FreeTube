app-id: io.freetubeapp.FreeTube
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --own-name=org.mpris.MediaPlayer2.freetube
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.SettingsDaemon
modules:
  - name: freetube
    buildsystem: simple
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/FreeTubeApp/FreeTube/releases/download/v0.25.3-beta/freetube-0.25.3-beta-linux-x64-portable.zip
        sha256: e3a671357ac32edcd872c6ea3218c8921bd0fda7318706d8570ece44d2c1fcbf
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/FreeTubeApp/FreeTube/releases?per_page=1
          version-query: .[0].tag_name
          url-query: .[0].assets[] | select(.name | endswith("-linux-x64-portable.zip"))
            | .browser_download_url
          timestamp-query: .[0].published_at
          release-url-template: https://github.com/FreeTubeApp/FreeTube/releases/tag/$version
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/FreeTubeApp/FreeTube/releases/download/v0.25.3-beta/freetube-0.25.3-beta-linux-arm64-portable.zip
        sha256: 2416b0ce365b4bea0caf3d17b177ac134c9d9a627a4a97bac01afaca2c1c681e
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/FreeTubeApp/FreeTube/releases?per_page=1
          version-query: .[0].tag_name
          url-query: .[0].assets[] | select(.name | endswith("-linux-arm64-portable.zip"))
            | .browser_download_url
          timestamp-query: .[0].published_at
          release-url-template: https://github.com/FreeTubeApp/FreeTube/releases/tag/$version
      # Icon
      - type: file
        url: https://raw.githubusercontent.com/FreeTubeApp/FreeTube/c3be513a586d235cbde730c66e49523aeeb5372f/_icons/iconFlathub.svg
        sha256: f6f6da27b839f04ecdc01e743435e898d0043e700178d712bfa5c01900541f90
      # Wrapper to launch the app
      - type: file
        path: run.sh
      - type: file
        path: io.freetubeapp.FreeTube.desktop
      - type: file
        path: io.freetubeapp.FreeTube.metainfo.xml
    build-commands:
      # Bundle app
      - unzip freetube-*.zip -d /app/freetube
      # Install app wrapper
      - install run.sh /app/bin/
      # Install app icon and desktop file
      - install -Dm644 iconFlathub.svg /app/share/icons/hicolor/scalable/apps/io.freetubeapp.FreeTube.svg
      - install -Dm644 io.freetubeapp.FreeTube.desktop -t /app/share/applications/
      - install -Dm644 io.freetubeapp.FreeTube.metainfo.xml -t /app/share/metainfo/
      - patch-electron-desktop-filename "${FLATPAK_DEST}"/freetube/resources/app.asar
